<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070707"><title>Night Watch</title>
<style>

.hint{font-size:12px;color:var(--mut)}
#nav{position:fixed;left:16px;right:16px;bottom:calc(12px + var(--sb));height:60px;border-radius:16px;background:rgba(12,12,13,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:10;max-width:608px;margin:0 auto}

.ln{fill:none;stroke:var(--y2);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;animation:draw 1.1s var(--ease) both}@keyframes draw{from{stroke-dashoffset:1}}
.ar{animation:fade .8s ease .4s both}@keyframes fade{from{opacity:0}}.dt{fill:var(--y2)}
.axt{font-size:11px;fill:var(--mut)}.empty{display:grid;place-items:center;gap:8px;padding:26px;color:var(--mut);text-align:center}.empty .bat{width:56px;height:28px;fill:#2e2e31}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:4px}.hc{aspect-ratio:1;border-radius:4px;background:#161617;border:0;padding:0}.hc.f{opacity:.3}.hc.l1{background:#2c2c2f}.hc.l2{background:#68686d}.hc.l3{background:#e6e6e6}.hc.t{outline:1px solid #fff;outline-offset:1px}
#splash{position:fixed;inset:0;z-index:100;background:#050505;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;animation:out .7s ease 2s forwards}@keyframes out{to{opacity:0;visibility:hidden}}
#splash .bat{width:150px;height:75px;animation:fade 1.2s ease .2s both}
#splash h1{margin:0;font-size:14px;font-weight:600;letter-spacing:.5em;padding-left:.5em;color:var(--y2);animation:fade 1s ease .8s both}
#splash p{margin:0;color:var(--mut);letter-spacing:.35em;font-size:10px;animation:fade 1s ease 1.2s both}
#toast{position:fixed;left:50%;bottom:calc(88px + var(--sb));transform:translate(-50%,16px);background:#18181a;border:1px solid #3a3a3d;padding:10px 16px;border-radius:99px;font-size:13px;opacity:0;transition:all .3s var(--ease);z-index:50;max-width:90vw;text-align:center;pointer-events:none}#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style></head><body>
<div id="fog"></div>
<svg width="0" height="0" style="position:absolute"><defs><g id="bt"><path d="M50 9 L52.2 6.2 L54.6 1 L56.6 10 C64 5.5 82 3.5 99.5 1.5 C98 11 95 18 90.5 22 Q87 17.5 82 18 Q79 21.5 78 27 Q73.5 22.5 68 23.5 Q64.5 27.5 63 33 Q60 29 57 30 Q55 36 50 42 Z"/><path transform="translate(100 0) scale(-1 1)" d="M50 9 L52.2 6.2 L54.6 1 L56.6 10 C64 5.5 82 3.5 99.5 1.5 C98 11 95 18 90.5 22 Q87 17.5 82 18 Q79 21.5 78 27 Q73.5 22.5 68 23.5 Q64.5 27.5 63 33 Q60 29 57 30 Q55 36 50 42 Z"/></g></defs></svg>
<div id="app" class="wrap view"></div><nav id="nav"></nav><div id="toast"></div>
<div id="splash"><svg class="bat" viewBox="0 0 100 50"><use href="#bt"/></svg><h1>NIGHT WATCH</h1><p>DISCIPLINE · STRENGTH · CONTROL</p></div>
<script src="jspdf.umd.min.js"></script><script src="jspdf.plugin.autotable.min.js"></script><script src="bridge.js"></script>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),today=()=>iso(new Date()),D=s=>new Date(s+'T00:00:00');
const add=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return iso(d)},fmtD=(s,o)=>D(s).toLocaleDateString('en-IN',o||{weekday:'short',day:'numeric',month:'short'});
const tm=t=>{if(!t)return null;const p=t.split(':');return +p[0]*60+ +p[1]},hhmm=m=>pad(Math.floor(m/60)%24)+':'+pad(Math.round(m%60)),nowT=()=>{const n=new Date();return pad(n.getHours())+':'+pad(n.getMinutes())};

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const def=()=>({v:1,st:{wake:'06:00',read:30,study:60,zepto:8,splits:['Push','Pull','Legs 1','Push BW','Pull BW','Legs 2']},days:{}});
let S=def(),ui={tab:'today',date:today(),met:'disc',rng:30,lift:'',reset:false,prev:{}};
const dg=d=>S.days[d]||{},dw=d=>S.days[d]||(S.days[d]={}),dirty=new Set();
const bat=()=>'<svg class="bat" viewBox="0 0 100 50"><use href="#bt"/></svg>';
function toast(m,ms){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),ms||3000)}
function persist(){const a=[...dirty];dirty.clear();try{DBB.save(S,a)}catch(e){console.error(e)}}
function commit(d){(Array.isArray(d)?d:[d]).forEach(x=>dirty.add(x));persist();render(false)}
/* ---- metrics ---- */
const exs=d=>(dg(d).ex||[]).filter(e=>e&&(e.s||[]).length),sets=d=>exs(d).flatMap(e=>e.s),nSets=d=>sets(d).filter(s=>+s.r>0).length,vol=d=>sum(sets(d),s=>(+s.r||0)*(+s.w||0));
const score=d=>{const x=dg(d),st=S.st;let p=0;const w=tm(x.wake),g=tm(st.wake);if(w!=null)p+=w<=g?25:w<=g+30?12:4;p+=Math.min(1,(+x.read||0)/(+st.read||1))*25+Math.min(1,(+x.study||0)/(+st.study||1))*25;if(nSets(d)>0)p+=25;return Math.round(p)};

const liftMax=(d,name)=>{const w=sum([0],()=>0);let m=null;exs(d).forEach(e=>{if((e.n||'').trim().toLowerCase()===name.toLowerCase())e.s.forEach(s=>{if(+s.w>0&&(m==null||+s.w>m))m=+s.w})});return m};
const names=()=>[...new Set(Object.keys(S.days).sort().flatMap(d=>exs(d).map(e=>(e.n||'').trim()).filter(Boolean)))];
const MET={disc:{l:'Discipline',f:d=>score(d),fmt:v=>Math.round(v)+'',all:1},vol:{l:'Gym volume',f:d=>vol(d)||null,fmt:v=>Math.round(v)+' kg'},wake:{l:'Wake-up',f:d=>tm(dg(d).wake),fmt:hhmm},read:{l:'Reading',f:d=>+dg(d).read||null,fmt:v=>Math.round(v)+' min'},study:{l:'Study',f:d=>+dg(d).study||null,fmt:v=>Math.round(v)+' min'},zepto:{l:'Zepto',f:d=>dur(dg(d).zs,dg(d).ze)/60||null,fmt:v=>v.toFixed(1)+' h'},lift:{l:'Lift',f:d=>liftMax(d,ui.lift||names()[0]||'~'),fmt:v=>v+' kg'}};
/* ---- animation helpers ---- */
function count(el,a,b,ms,dec){const t0=performance.now();ms=ms||900;(function f(t){const k=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-k,3),v=a+(b-a)*e;el.textContent=dec?v.toFixed(dec):Math.round(v);if(k<1)requestAnimationFrame(f)})(t0)}
function flash(){const f=document.createElement('div');f.id='flash';document.body.appendChild(f);setTimeout(()=>f.remove(),900)}
/* ---- views ---- */
const dateBar=()=>{const d=ui.date,t=today();return `<div class="dbar" style="--i:0"><button class="ic" data-act="day" data-n="-1" aria-label="Previous day">‹</button><label class="dl"><span>${d===t?'Today · ':''}${esc(fmtD(d,{weekday:'short',day:'numeric',month:'short',year:'numeric'}))}</span><input type="date" value="${d}" data-act="pick" aria-label="Pick date"></label><button class="ic" data-act="day" data-n="1" aria-label="Next day">›</button></div>`+(d!==t?`<div class="chips" style="--i:0"><button class="chip" data-act="now">↩ Back to today</button></div>`:'')};

function vToday(){const d=ui.date,x=dg(d),sc=score(d),st=S.st,from=ui.anim?0:(ui.prev[d]==null?sc:ui.prev[d]);ui.pf=from;
 const w=tm(x.wake),g=tm(st.wake),late=w==null?null:w-g,zm=dur(x.zs,x.ze),run=x.zs&&!x.ze&&d===today()?dur(x.zs,nowT()):0,zh=(zm||run)/60,zp=Math.min(100,zh/(+st.zepto||1)*100),ns=nSets(d),sk=streak();
 return dateBar()+`<section class="card hero" style="--i:1"><div class="ringw"><svg class="ring" viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" class="rt"/><circle id="rp" cx="60" cy="60" r="52" class="rg" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-from/100)}" data-to="${C*(1-sc/100)}"/></svg><b id="scn">${from}</b></div><div style="display:flex;flex-direction:column;gap:6px"><h2>Discipline today</h2><span class="tag ${sc>=75?'g':sc>=50?'w':''}">${sc>=75?'Relentless':sc>=50?'On track':'Behind'}</span><span class="sm mut">${sk}-day streak</span><span class="sm mut">Wake · Read · Study · Gym</span></div></section>
 <section class="card" style="--i:2"><div class="row sb"><h2>Wake-up</h2><span class="tag ${late==null?'':late<=0?'g':late<=30?'w':'r'}">${late==null?'Goal '+st.wake:late<=0?'On time':'+'+late+' min late'}</span></div><div class="row"><input type="time" value="${x.wake||''}" data-k="wake" aria-label="Wake-up time" style="font-size:24px;font-weight:800;text-align:center"><button class="btn pri" data-act="stamp" data-k="wake">Now</button></div></section>`
 +counter('read','Book reading',+st.read,3)+counter('study','Study time',+st.study,4)
 +`<section class="card" style="--i:5"><div class="row sb"><h2>Zepto timings</h2><span class="tag ${zh>=st.zepto?'g':''}">${zh.toFixed(1)} h · goal ${st.zepto} h</span></div><div class="g2"><label class="sm mut">Start<input type="time" value="${x.zs||''}" data-k="zs"></label><label class="sm mut">End<input type="time" value="${x.ze||''}" data-k="ze"></label></div><div class="bar"><i style="width:${zp}%"></i></div><div class="g2"><button class="btn" data-act="stamp" data-k="zs">Start now</button><button class="btn" data-act="stamp" data-k="ze">Stop now</button></div></section>

 const cards=ex.map((e,i)=>{const cur=Math.max(0,...e.s.map(s=>+s.w||0)),h=lastHint(e.n,d),pr=(()=>{if(!e.n||!cur)return false;let b=0,any=false;for(const k of Object.keys(S.days)){if(k>=d)continue;const m=liftMax(k,e.n.trim());if(m!=null){any=true;if(m>b)b=m}}return any&&cur>b})();

 return dateBar()+sp+(cards||`<section class="card" style="--i:2"><div class="empty">${bat()}<p>No exercises logged.<br>Add any exercise, any sets.</p></div></section>`)+`<button class="btn pri" data-act="addEx" style="--i:${ex.length+3}">+ Add exercise</button><datalist id="exl">${names().map(n=>`<option value="${esc(n)}">`).join('')}</datalist>`+(nSets(d)?`<section class="card" style="--i:${ex.length+4}"><div class="g2"><div class="tile"><span class="sm mut">SETS</span><b>${nSets(d)}</b></div><div class="tile"><span class="sm mut">VOLUME</span><b>${Math.round(vol(d)).toLocaleString('en-IN')} kg</b></div></div></section>`:'')}
function pts(){const t=today(),keys=Object.keys(S.days).sort(),first=keys[0]||t,a=add(t,-ui.rng+1),start=a>first?a:first,m=MET[ui.met],P=[];for(let d=start;d<=t;d=add(d,1)){const v=m.f(d);if(v!=null&&(m.all||v>0))P.push({d,v,o:Math.round((D(d)-D(start))/864e5)})}return{P,span:Math.max(1,Math.round((D(t)-D(start))/864e5))}}

  if(wr.length){y=sec('Workout'+(x.split?' - '+T(x.split):''),y);y=tb(y,['EXERCISE','SETS (REPS x KG)','TOP WEIGHT','VOLUME'],wr.concat([['TOTAL',ns+' sets','',Math.round(vol(d)).toLocaleString('en-IN')+' kg']]),{1:{cellWidth:200}})}
  if(x.note){y=sec('Note',y);const ln=doc.splitTextToSize(T(x.note),W-2*M);doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(60,60,66);doc.text(ln,M,y+6);y+=ln.length*13+30}
  y=sec('Last 7 days',y);y=tb(y,['DATE','SCORE','WAKE','READ','STUDY','GYM'],l7.map(k=>{const q=dg(k);return [T(fmtD(k,{weekday:'short',day:'numeric',month:'short'})),score(k),q.wake||'-',(q.read||0)+' min',(q.study||0)+' min',nSets(k)?nSets(k)+' sets':'-']}));
  const np=doc.internal.getNumberOfPages();for(let i=1;i<=np;i++){doc.setPage(i);doc.setFontSize(7.5);doc.setTextColor(140,140,146);doc.text('NIGHT WATCH  |  Daily report  |  '+d,M,H-22);doc.text('Page '+i+' of '+np,W-M,H-22,{align:'right'})}
  const fn='NightWatch_Daily_'+d+'.pdf';if(window.DBB&&DBB.native){const r=await DBB.savePdf(doc.output('datauristring').split(',')[1],fn);toast(r.savedTo?'Saved to '+r.savedTo:'Report ready. Choose where to save it.',4500)}else{doc.save(fn);toast('Report downloaded')}
 }catch(e){console.error(e);toast('Could not create PDF: '+(e&&e.message||e),6000)}}
